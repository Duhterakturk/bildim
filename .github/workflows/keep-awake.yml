# Render'ın ücretsiz web servisi 15 dakika istek gelmezse uyur.
# GitHub bu zamanı sık geciktirir; asıl uyanma, site açılınca tarayıcının
# sağlık ucuna dokunmasıdır. Bu iş yine de fırsat buldukça pingler.
name: Keep API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
               run: curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --max-time 120 https://mindarena-api.onrender.com/api/health
