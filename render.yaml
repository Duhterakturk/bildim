# Render Blueprint — ücretsiz katman.
# API ayrı bir Render workspace'inde (MindArena) çalışır.
#
# Veritabanı Render'da değil. Render'ın ücretsiz Postgres'i 30 gün sonra
# kapanır ve skorlar silinir. Skorlar Neon'da durur (ücretsiz, silinmez).
#
# Kurulum:
# 1. neon.tech → ücretsiz proje, bölge Europe (Frankfurt).
# 2. Connection string'i kopyala. İçinde sslmode=require olsun.
# 3. Render → New → Blueprint → bu repo. DATABASE_URL sorulunca Neon
#    dizesini yapıştır.
#
# Servis adları Render'da globaldir. Biri doluysa Render yeni ad önerir;
# o zaman aşağıdaki CORS_ORIGINS ve VITE_API_URL değerlerini de yeni
# adreslerle değiştir.

services:
  - type: web
    name: mindarena-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://mindarena-app.onrender.com
      - key: PUBLIC_APP_URL
        value: https://mindarena-app.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: mindarena-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://mindarena-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
